# opg CI – offline gate on all three platforms; Linux integration + sanitizers.
#
# Odin nightly pin: dev-2026-08. Bump the ODIN_REF value to update.
# macOS/Windows integration testing deferred to OPG-502 (native TLS backends).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin: Odin nightly tag. Bump this single value to update all runners.
  # https://github.com/odin-lang/Odin/releases
  ODIN_REF: dev-2026-08

jobs:
  # --------------------------------------------------------------------------
  # Offline gate: compile + unit tests (no database required).
  # Runs on all three platforms.
  # --------------------------------------------------------------------------
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            odin_archive: odin-ubuntu-amd64-nightly+date-2026-08-15.tar.gz
            odin_dir: odin-linux-amd64-nightly+date-2026-08-15
          - os: macos-latest
            odin_archive: odin-macos-amd64-nightly+date-2026-08-15.tar.gz
            odin_dir: odin-macos-amd64-nightly+date-2026-08-15
          - os: windows-latest
            odin_archive: odin-windows-amd64-nightly+date-2026-08-15.zip
            odin_dir: odin-windows-amd64-nightly+date-2026-08-15

    runs-on: ${{ matrix.os }}
    name: offline (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - name: Cache Odin compiler
        id: cache-odin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/odin
          key: odin-${{ matrix.os }}-${{ env.ODIN_REF }}

      - name: Install Odin (Linux)
        if: runner.os == 'Linux' && steps.cache-odin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${{ env.ODIN_REF }}/${{ matrix.odin_archive }}" \
            -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          rm "$RUNNER_TEMP/odin.tar.gz"

      - name: Install Odin (macOS)
        if: runner.os == 'macOS' && steps.cache-odin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${{ env.ODIN_REF }}/${{ matrix.odin_archive }}" \
            -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          rm "$RUNNER_TEMP/odin.tar.gz"

      - name: Install Odin (Windows)
        if: runner.os == 'Windows' && steps.cache-odin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\odin"
          $url = "https://github.com/odin-lang/Odin/releases/download/${{ env.ODIN_REF }}/${{ matrix.odin_archive }}"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\odin.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\odin.zip" -DestinationPath "$env:RUNNER_TEMP\odin-extract"
          # The zip typically contains a single top-level directory; move its contents up.
          $inner = Get-ChildItem "$env:RUNNER_TEMP\odin-extract" | Select-Object -First 1
          Copy-Item -Path "$($inner.FullName)\*" -Destination "$env:RUNNER_TEMP\odin" -Recurse -Force
          Remove-Item "$env:RUNNER_TEMP\odin.zip" -Force
          Remove-Item "$env:RUNNER_TEMP\odin-extract" -Recurse -Force

      - name: Add Odin to PATH
        shell: bash
        run: echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Verify Odin installation
        shell: bash
        run: odin version

      - name: Compile check (no entry point)
        shell: bash
        run: odin check . -no-entry-point -vet -strict-style

      - name: Run offline tests
        shell: bash
        run: odin test tests -all-packages -vet -strict-style

  # --------------------------------------------------------------------------
  # Linux-only: full integration test suite against dockerized PostgreSQL,
  # plus AddressSanitizer and ThreadSanitizer passes.
  # --------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    name: integration (ubuntu-latest)
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - name: Cache Odin compiler
        id: cache-odin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/odin
          key: odin-ubuntu-latest-${{ env.ODIN_REF }}

      - name: Install Odin
        if: steps.cache-odin.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${{ env.ODIN_REF }}/odin-ubuntu-amd64-nightly+date-2026-08-15.tar.gz" \
            -o "$RUNNER_TEMP/odin.tar.gz"
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          rm "$RUNNER_TEMP/odin.tar.gz"

      - name: Add Odin to PATH
        shell: bash
        run: echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Start PostgreSQL (docker compose)
        run: docker compose up -d --wait postgres

      - name: Integration tests
        run: scripts/integration-test.sh

      - name: Integration tests (AddressSanitizer)
        run: odin test tests -all-packages -vet -strict-style -define:OPG_INTEGRATION=true -sanitize:address

      - name: Pool concurrency tests (ThreadSanitizer)
        run: odin test pgconn -define:OPG_INTEGRATION=true -sanitize:thread

      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down
